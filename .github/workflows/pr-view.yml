name: "🤖 Pull Panda PR Reviewer"

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:

      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "RAG_Version 1.3/requirement.txt"

      # Run ingestion
      - name: Run RAG Ingestion
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ai

        run: |
          echo "Running ingestion..."
          python "RAG_Version 1.3/corrected_ingest_V_1.3.py"

      # Run reviewer
      - name: Generate AI Review
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ai

        run: |
          echo "Generating Review..."
          python "RAG_Version 1.3/iterative_prompt_selector.py"

      # Upload generated reports
      - name: Upload Review Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pull-panda-results
          path: |
            *.md
            *.json

      # Cleanup
      - name: Cleanup
        if: always()
        run: |
          rm -rf temp_ingest_repo
          rm -rf temp_client_repo
          rm -rf repo_clone
